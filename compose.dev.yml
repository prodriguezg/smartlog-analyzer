services:
  frontend:
    build:
      target: development
    environment:
      API_PROXY_TARGET: http://backend:3000
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/frontend/src
          initial_sync: true
        - action: sync
          path: ./frontend/index.html
          target: /app/frontend/index.html
          initial_sync: true
        - action: sync
          path: ./frontend/vite.config.js
          target: /app/frontend/vite.config.js
          initial_sync: true
        - action: rebuild
          path: ./frontend/Dockerfile
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  backend:
    build:
      target: development
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /app/backend/src
          initial_sync: true
        - action: sync
          path: ./backend/openapi.yaml
          target: /app/backend/openapi.yaml
          initial_sync: true
        - action: rebuild
          path: ./backend/Dockerfile
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
