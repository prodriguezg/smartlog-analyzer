server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api backend:3000;
        proxy_pass http://$api;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
